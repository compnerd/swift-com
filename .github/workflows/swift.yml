name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - branch: development
            tag: DEVELOPMENT-SNAPSHOT-2025-09-14-a

    steps:
    - uses: compnerd/gha-setup-swift@main
      with:
        swift-build: ${{ matrix.tag }}
        swift-version: ${{ matrix.branch }}

    - uses: actions/checkout@v2

    - name: Build
      run: swift build

    - name: Run tests
      run: swift test
